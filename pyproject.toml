[tool.poetry]
name = "ai-soc-agent"
version = "0.1.0"
description = "AI SOC log-analysis copilot — first project of the longyuanai suite"
authors = ["longyuanai"]
license = "MIT"
readme = "README.md"
packages = [{ include = "ai_soc_agent", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
shared-llm-core = { path = "../000shared-llm-core", develop = true }
click = "^8.1.7"
rich = "^13.7.1"
fastapi = "0.139.2"
uvicorn = "0.51.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-mock = "^3.14.0"

[tool.poetry.plugins."longyuanai.soc_patterns"]
"001.brute_force" = "ai_soc_agent.patterns.brute_force:BruteForceBurstRule"
"001.geo_anomaly" = "ai_soc_agent.patterns.geo_anomaly:GeoAnomalousLoginRule"
"001.priv_esc" = "ai_soc_agent.patterns.priv_esc:PrivilegeEscalationRule"
"001.lateral_movement" = "ai_soc_agent.patterns.lateral_movement:LateralMovementRule"
"001.credential_stuffing" = "ai_soc_agent.patterns.credential_stuffing:CredentialStuffingRule"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"
