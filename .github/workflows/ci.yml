name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # shared-llm-core is a path dependency on a sibling repo that is not
      # available here, so install the runtime deps directly. Tests fall back
      # to tests/_contract_stub for the shared package.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install click rich fastapi uvicorn pytest pytest-mock httpx ruff

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: python -m pytest -q
